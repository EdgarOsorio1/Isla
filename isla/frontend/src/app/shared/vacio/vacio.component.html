@if (cargando()) {
  <div class="cargando" role="status"><span class="giro"></span> cargando...</div>
} @else if (error()) {
  <div class="alerta-error" role="alert">{{ error() }}</div>
} @else if (vacio()) {
  <div class="estado-caja">
    <strong>{{ titulo() }}</strong>
    {{ detalle() }}
  </div>
}
