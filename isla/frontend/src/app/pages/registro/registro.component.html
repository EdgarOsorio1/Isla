<app-auth-marco>
  <h1>crear cuenta</h1>
  <p class="ayuda">con tu cuenta puedes reportar alertas y seguir su atención.</p>
  @if (error()) {
    <div class="alerta-error" role="alert">{{ error() }}</div>
  }
  <form [formGroup]="form" (ngSubmit)="registrar()" novalidate>
    <app-campo etiqueta="nombre completo" para="nombre" [control]="form.controls.nombre">
      <input id="nombre" type="text" formControlName="nombre" autocomplete="name" />
    </app-campo>
    <app-campo etiqueta="correo electrónico" para="email" [control]="form.controls.email">
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </app-campo>
    <app-campo etiqueta="teléfono (opcional)" para="telefono" [control]="form.controls.telefono">
      <input id="telefono" type="tel" formControlName="telefono" autocomplete="tel" />
    </app-campo>
    <app-campo etiqueta="contraseña" para="clave" [control]="form.controls.clave" ayuda="mínimo 8 caracteres con letras y números">
      <input id="clave" type="password" formControlName="clave" autocomplete="new-password" />
    </app-campo>
    <app-campo etiqueta="confirmar contraseña" para="confirmar" [control]="form.controls.confirmar">
      <input id="confirmar" type="password" formControlName="confirmar" autocomplete="new-password" />
    </app-campo>
    <button class="btn btn-primario" type="submit" [disabled]="cargando()">{{ cargando() ? 'creando cuenta...' : 'crear cuenta' }}</button>
  </form>
  <p style="margin-top: 1.25rem">¿ya tienes cuenta? <a routerLink="/login">iniciar sesión</a></p>
</app-auth-marco>
