<app-auth-marco>
  <h1>iniciar sesión</h1>
  <p class="ayuda">entra con tu cuenta para reportar o gestionar casos.</p>
  @if (error()) {
    <div class="alerta-error" role="alert">{{ error() }}</div>
  }
  <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <app-campo etiqueta="correo electrónico" para="email" [control]="form.controls.email">
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </app-campo>
    <app-campo etiqueta="contraseña" para="clave" [control]="form.controls.clave">
      <input id="clave" type="password" formControlName="clave" autocomplete="current-password" />
    </app-campo>
    <button class="btn btn-primario" type="submit" [disabled]="cargando()">{{ cargando() ? 'entrando...' : 'iniciar sesión' }}</button>
  </form>
  <p style="margin-top: 1.25rem">¿no tienes cuenta? <a routerLink="/registro">crear una cuenta</a></p>
</app-auth-marco>
